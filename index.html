<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>민우의 459일</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1e0;--pn:#fffdf8;--bd:#f4a7b9;--ink:#5a3b32;--dim:#9a7b6e;--pk:#ff8fab;--mint:#8fd6c0;--sky:#8ec5f0;--lav:#c9b0ee;--yel:#ffd36e;--red:#e8695a;--tip:#fffdf7;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2029;--pn:#3a2c38;--bd:#a8546c;--ink:#f6e3dc;--dim:#c4a79e;--tip:#3a2c38}}
:root[data-theme="dark"]{--bg:#2b2029;--pn:#3a2c38;--bd:#a8546c;--ink:#f6e3dc;--dim:#c4a79e;--tip:#3a2c38}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jua','Noto Sans KR',sans-serif;line-height:1.5}
body{background:radial-gradient(var(--bd) 1.2px,transparent 1.5px) 0 0/26px 26px,var(--bg);min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:10px}
.pn{background:var(--pn);border:3px dotted var(--bd);border-radius:20px;padding:12px;box-shadow:0 4px 0 var(--bd)}
h2{margin:0 0 8px;font-size:16px;color:var(--pk)}
#top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}#top h1{margin:0;font-size:22px;color:var(--pk)}
.chip{display:inline-block;font-size:12px;background:var(--yel);color:#5a3b32;border-radius:12px;padding:1px 9px;margin:2px 3px 2px 0}.chip.r{background:var(--red);color:#fff}.chip.m{background:var(--mint)}
#grid{display:grid;grid-template-columns:270px 1fr 280px;gap:14px}@media(max-width:920px){#grid{grid-template-columns:1fr}}
.bar{font-size:12px;margin:4px 0}.bar i{display:block;height:10px;background:#0002;border-radius:8px;margin-top:1px;overflow:hidden}.bar i b{display:block;height:100%;border-radius:8px}
.rk{background:var(--pk);color:#fff;border-radius:8px;padding:0 6px;font-size:12px}.ok{color:#2f9a6a}.no{color:var(--red)}
.av{width:110px;height:110px;line-height:0;overflow:hidden;border-radius:50%;margin:0 auto 6px;border:3px solid var(--yel)}.av img{width:100%;height:100%;object-fit:cover}
.fr{display:flex;gap:8px;padding:6px 0;border-bottom:2px dashed var(--bd)}.fr:last-child{border:0}.fa{flex:none}.fa img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--yel)}.xp{width:60%;max-width:240px;border-radius:16px;border:3px solid var(--yel)}.mi{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle}.fb{flex:1}
.bf{font-size:11px;color:var(--dim)}.bf.on{color:var(--ink)}.bf.on.good{color:#2f9a6a}.bf.on.bad{color:var(--red)}
#sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}
.s{border:2px dashed var(--pk);border-radius:14px;min-height:62px;padding:6px;font-size:13px;cursor:pointer;text-align:center;background:#ff8fab14}.s small{display:block;color:var(--dim)}
button{font-family:inherit;color:#4a2f27;border:0;border-radius:14px;padding:8px 10px;cursor:pointer;font-size:13px;text-align:left;box-shadow:0 3px 0 #0003}
button:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}button:active:not(:disabled){transform:translateY(2px);box-shadow:none}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible{outline:3px solid var(--ink)}
button small{display:block;color:#6b4a3f;font-size:11px}
.ab{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:7px;margin-bottom:10px}.go{background:var(--pk);color:#fff;font-size:16px;text-align:center}.sm{background:var(--lav)}
.cd{font-size:12px;padding:5px 8px;border-radius:10px;margin-bottom:5px;background:var(--yel);color:#4a2f27}.cd.lg{background:linear-gradient(90deg,#ffd36e,#ff9fb5)}.cd.off{opacity:.65}.cd button{padding:2px 8px;margin-top:3px;font-size:12px}
#tip{position:fixed;z-index:20;max-width:300px;background:var(--tip);border:2px solid var(--pk);border-radius:12px;padding:8px 10px;font-size:12px;display:none;pointer-events:none}#tip hr{border:0;border-top:1px dashed var(--bd);margin:5px 0}.f{color:var(--dim)}
#ov{position:fixed;inset:0;background:#0007;display:none;place-items:center;padding:16px;z-index:9}#ov .pn{max-width:640px;width:100%;max-height:90vh;overflow:auto}#ov h1{margin:0 0 8px;color:var(--pk);font-size:24px}
.rp div{font-size:13px;padding:2px 0;border-bottom:1px dotted var(--bd)}.rp .b{color:var(--red)}.rp .g{color:#2f9a6a}.rp .m{color:#b07a00}.rp .w{color:var(--dim)}
.cho{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:10px}.cho button{background:var(--yel);padding:12px}.cho button.lg{background:linear-gradient(90deg,#ffd36e,#ff9fb5)}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb td{padding:3px 6px;border-bottom:1px dotted var(--bd)}.scene{font-size:32px;text-align:center;background:var(--yel);border-radius:16px;padding:10px;margin-bottom:8px;color:#4a2f27}
.eb{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:10px 0}.eb div{border:2px dashed var(--bd);border-radius:14px;padding:8px;text-align:center;opacity:.7}.eb div.on{border-style:solid;border-color:var(--pk);background:#ff8fab14;opacity:1}.eb span{display:block;font-size:30px}.eb b{display:block;font-size:14px}.eb small{display:block;font-size:11px;color:var(--dim)}.nw{background:var(--yel);color:#4a2f27;border-radius:12px;padding:6px 10px;text-align:center}
.mainv{text-align:center}.mainv .av{width:150px;height:150px}.mainv h1{font-size:30px!important}.mb{display:grid;gap:10px;max-width:340px;margin:14px auto}.mb button{font-size:18px;padding:14px;text-align:center}.mb .sm{font-size:14px;padding:8px}
.rkt{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}.rkt th,.rkt td{padding:4px 6px;border-bottom:1px dotted var(--bd);text-align:right}.rkt th:nth-child(2),.rkt td:nth-child(2){text-align:left}.rkt tr.me td{background:#ffd36e55}.rkt td.k,.rkt th.k{font-weight:bold;color:var(--pk)}.rkw{overflow-x:auto}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.tabs button.on{background:var(--pk);color:#fff}
</style></head><body><div class="wrap">
<div id="top" class="pn"></div>
<div id="grid"><div class="pn" id="L"></div><div class="pn" id="C"></div><div class="pn" id="Rt"></div></div></div>
<div id="tip"></div><div id="ov"><div class="pn" id="ovb"></div></div>
